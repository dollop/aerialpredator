# ─────────────────────────────────────────────────────────────────────────────
# Aerial Predator — Reverse Proxy Configuration for nginx
#
# PURPOSE:
#   Routes requests to /platform-feed/ through to the internal platform at
#   http://72.62.200.123:3000/, stripping X-Frame-Options and CSP headers
#   that block the embedded iframe on platform.html.
#
#   This also solves the mixed-content problem: the browser sees the iframe
#   src as https://aerialpredator.com/platform-feed/ (same origin, HTTPS),
#   so no mixed-content block is triggered.
#
# INSTALLATION:
#   1. Add the location block below inside your existing `server { }` block
#      for aerialpredator.com in your nginx site config
#      (usually at /etc/nginx/sites-available/aerialpredator.com or
#       /etc/nginx/conf.d/aerialpredator.com.conf)
#
#   2. Test the config:     sudo nginx -t
#   3. Reload nginx:        sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────

# Add this INSIDE your existing server { ... } block for aerialpredator.com:

    location /platform-feed/ {

        # Proxy all requests to the internal platform
        proxy_pass         http://72.62.200.123:3000/;

        proxy_http_version 1.1;

        # Required headers
        proxy_set_header   Host              72.62.200.123:3000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (needed for live-updating OSINT feeds)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Strip headers that prevent the iframe from rendering
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Content-Type-Options;

        # Allow framing from same origin (aerialpredator.com)
        add_header         X-Frame-Options "SAMEORIGIN" always;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # Buffer settings
        proxy_buffering        off;
        proxy_cache_bypass     $http_upgrade;
    }


# ─────────────────────────────────────────────────────────────────────────────
