<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERIAL PREDATOR // LIVE CONSOLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Barlow+Condensed:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }

    #ap-bar {
      height: 44px;
      background: rgba(0,0,0,0.95);
      border-bottom: 1px solid #ff3b30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(8px);
    }

    .ap-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .ap-mark {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ff3b30;
      border: 1px solid #ff3b30;
      padding: 2px 6px;
      letter-spacing: 0.05em;
    }

    .ap-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
    }

    .ap-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ap-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #34c759;
      border: 1px solid rgba(52,199,89,0.3);
      padding: 3px 8px;
      text-transform: uppercase;
    }

    .ap-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 6px #34c759;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .ap-return {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a1a1a1;
      text-decoration: none;
      border: 1px solid #3a3a3a;
      padding: 6px 14px;
      transition: all 0.15s ease;
    }

    .ap-return:hover {
      color: #fff;
      border-color: #ff3b30;
      background: rgba(255,59,48,0.05);
    }

    #ap-frame {
      width: 100%;
      height: calc(100vh - 44px);
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
      .ap-name { display: none; }
      .ap-badge { display: none; }
    }
  </style>
</head>
<body>
  <div id="ap-bar">
    <a href="/" class="ap-brand">
      <span class="ap-mark">AP</span>
      <span class="ap-name">Aerial Predator</span>
    </a>
    <div class="ap-right">
      <span class="ap-badge">
        <span class="ap-dot"></span>
        LIVE FEED
      </span>
      <a href="/" class="ap-return">← Return to Base</a>
    </div>
  </div>
  <iframe id="ap-frame" src="/platform-feed/" title="Aerial Predator Live Console"></iframe>
</body>
</html>
